name: Kit TCK

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tck-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Discover the kits instead of listing them. Any directory holding a
  # spec.yaml is a kit, so a new kit needs no change here.
  discover:
    runs-on: ubuntu-latest
    outputs:
      kits: ${{ steps.collect.outputs.kits }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Collect kit directories
        id: collect
        run: |
          kits=$(for f in */spec.yaml; do [ -f "$f" ] && dirname "$f"; done | sort -u | jq -R . | jq -sc .)
          echo "kits=${kits}" >> "$GITHUB_OUTPUT"
          echo "Kits: ${kits}"

  # Container TCK. The suite comes from the published
  # github.com/docker/sbx-kits-contrib module, pinned in go.mod, so these kits
  # are tested by the same harness Docker's own kit repository uses. It starts
  # a container through testcontainers and asserts that the kit's declared
  # environment, files and tmpfs mounts are really there.
  tck:
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        kit: ${{ fromJson(needs.discover.outputs.kits) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run the TCK for ${{ matrix.kit }}
        env:
          KIT_DIR: ${{ matrix.kit }}
        run: ./scripts/test-kit.sh "$KIT_DIR" -timeout 15m

  # Validate each spec against a real sbx binary as well as the pinned module.
  # The CLI and the module release on their own schedules, so this is what
  # catches a schema change that has shipped in sbx but not in the module the
  # TCK job pins.
  validate:
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        kit: ${{ fromJson(needs.discover.outputs.kits) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install sbx
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/install-sbx.sh >> "$GITHUB_PATH"

      - name: sbx kit validate
        env:
          KIT_DIR: ${{ matrix.kit }}
        run: sbx kit validate "./$KIT_DIR"

      - name: sbx kit inspect
        env:
          KIT_DIR: ${{ matrix.kit }}
        run: sbx kit inspect "./$KIT_DIR"

  # End-to-end against a real sandbox, under the deny-all network policy. This
  # is the job that proves permissions.network.allow is complete. It needs a
  # Docker Hub credential to pull the sandbox template, so it skips itself when
  # one is not configured rather than failing the build. Fork pull requests
  # never receive the secret, so they always skip.
  e2e:
    needs: discover
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/e2e.yml
    with:
      kits: ${{ needs.discover.outputs.kits }}
    secrets: inherit
