name: Release cloudsmith-cli kit

# Releases the newest version in cloudsmith-cli/CHANGELOG.md when no tag exists
# for it yet. A kit whose signature does not verify is signed first; the merge
# of the signature pull request starts this workflow again. A tag that
# GITHUB_TOKEN creates starts no workflows, so this workflow calls the publish
# workflows itself.
on:
  push:
    branches:
      - main
    paths:
      - cloudsmith-cli/CHANGELOG.md
      - cloudsmith-cli/kit.sig.bundle
      # A kit change closes an open signature pull request, so release again.
      - "*/spec.yaml"
      - "*/files/**"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: release-cloudsmith-cli
  cancel-in-progress: false
  queue: max

jobs:
  version:
    name: Find the version to release
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      released: ${{ steps.version.outputs.released }}
      signed: ${{ steps.signature.outputs.signed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Read the newest CHANGELOG version
        id: version
        run: |
          set -euo pipefail
          version="$(sed -n 's/^## \[\([0-9]*\.[0-9]*\.[0-9]*\)\].*/\1/p' cloudsmith-cli/CHANGELOG.md | head -n 1)"
          grep -Fxq "version: \"$version\"" cloudsmith-cli/spec.yaml ||
            { echo "::error::cloudsmith-cli/spec.yaml does not have version $version"; exit 1; }
          tag="cloudsmith-cli-v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          status=0
          git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null || status=$?
          case "$status" in
            0) echo "::notice::$tag has a tag, so this run does not publish it. To retry a failed publish, re-run the failed jobs of its release run."
               echo "released=true" >> "$GITHUB_OUTPUT" ;;
            2) echo "$tag is not released yet"; echo "released=false" >> "$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac

      - name: Install sbx
        if: steps.version.outputs.released == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLI_ONLY: "1"
        run: ./scripts/install-sbx.sh >> "$GITHUB_PATH"

      - name: Verify the kit signature
        id: signature
        if: steps.version.outputs.released == 'false'
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if sbx kit verify \
            --certificate-identity "https://github.com/${REPOSITORY}/.github/workflows/sign.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com ./cloudsmith-cli; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet HEAD^ HEAD -- cloudsmith-cli/kit.sig.bundle; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::The new signature of the cloudsmith-cli kit does not verify"
            exit 1
          fi

  sign:
    name: Sign the kits
    needs: version
    if: needs.version.outputs.released == 'false' && needs.version.outputs.signed == 'false'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/sign.yml
    with:
      merge: true
    secrets:
      CLOUDSMITH_BOT_TOKEN: ${{ secrets.CLOUDSMITH_BOT_TOKEN }}
      CLOUDSMITH_BOT_NAME: ${{ secrets.CLOUDSMITH_BOT_NAME }}
      CLOUDSMITH_BOT_EMAIL: ${{ secrets.CLOUDSMITH_BOT_EMAIL }}
      CLOUDSMITH_BOT_SSH_SIGNING_KEY: ${{ secrets.CLOUDSMITH_BOT_SSH_SIGNING_KEY }}

  tag:
    name: Create the release tag
    needs: version
    if: needs.version.outputs.released == 'false' && needs.version.outputs.signed == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create the release tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA"

  publish:
    name: Publish to Cloudsmith
    needs: [version, tag]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.version.outputs.tag }}

  publish-dockerhub:
    name: Publish to Docker Hub
    needs: [version, tag]
    if: vars.DOCKERHUB_PUBLISH_ENABLED == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-dockerhub.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
    secrets:
      DOCKERHUB_PUBLISH_USER: ${{ secrets.DOCKERHUB_PUBLISH_USER }}
      DOCKERHUB_PUBLISH_TOKEN: ${{ secrets.DOCKERHUB_PUBLISH_TOKEN }}
